<svg xmlns="http://www.w3.org/2000/svg" viewBox="1261.8 199.2 3228.6 3228.6" role="img" aria-label="The Playhouse Company">
  <!--
    The Playhouse Company figure, lifted from the official logo with the
    wording removed, as requested.

    The source logo is one flat drawing: the lettering is paths, not text, so
    the mark was separated by measuring every path and keeping only those that
    make up the figure. The viewBox is the figure's own bounding box, squared
    and padded, so nothing is cropped and the mark sits centred at any size.

    The figure contains white shapes, which is why it sits on a light tile
    rather than the burgundy: on a dark ground the faces would disappear.
  -->
  <style type="text/css">
   <![CDATA[
    .fil1 {fill:#FEFEFE;fill-rule:nonzero}
    .fil11 {fill:#2B7468;fill-rule:nonzero}
    .fil7 {fill:black;fill-rule:nonzero}
    .fil10 {fill:black;fill-rule:nonzero}
    .fil12 {fill:black;fill-rule:nonzero}
    .fil6 {fill:black;fill-rule:nonzero}
    .fil13 {fill:black;fill-rule:nonzero}
    .fil3 {fill:#2779BD;fill-rule:nonzero}
    .fil9 {fill:#2B7468;fill-rule:nonzero}
    .fil2 {fill:#454B8A;fill-rule:nonzero}
    .fil4 {fill:#874878;fill-rule:nonzero}
    .fil15 {fill:#B27C52;fill-rule:nonzero}
    .fil5 {fill:#EB4045;fill-rule:nonzero}
    .fil8 {fill:#F07C39;fill-rule:nonzero}
    .fil14 {fill:#B27C52;fill-rule:nonzero;fill-opacity:0.501961}
    .fil0 {fill:url(#id0)}
   ]]>
